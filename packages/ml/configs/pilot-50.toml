# The first hour on any new machine: 50 steps to measure throughput and catch breakage before a
# real run. Same recipe as mi300x-base.toml; only the length changes.
base_id = "Qwen/Qwen3-VL-4B-Instruct"
device = "rocm"
quant = "none"
dtype = "bf16"
image_max_px = 448
lora_r = 16
lora_alpha = 16
train_vision = false
lr = 1e-4
epochs = 1
max_steps = 50
batch_size = 4
grad_accum = 2
save_every = 25
seed = 0
