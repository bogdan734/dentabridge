[project]
name = "dentabridge-core"
version = "0.1.0"
description = "Contracts, ports, policy and i18n shared by every DentaBridge package"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2"]

[project.scripts]
dentabridge-lint = "dentabridge_core.policy.lint_cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
