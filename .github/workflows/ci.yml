name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.19"
      - run: uv sync --locked
      - run: scripts/check
