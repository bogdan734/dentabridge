[project]
name = "dentabridge-ml"
version = "0.1.0"
description = "Dataset records, training, evaluation and vision backends"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dentabridge-core",
    "httpx>=0.28",
    "numpy>=2",
    "pillow>=11",
]

[project.optional-dependencies]
# Training, the Ollama round-trip pilot and local inference. CI and the gate do not install it.
train = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.10",
]
# 4-bit base weights for a 16 GB GPU (the lean recipe); also runs on CPU, which the tests use.
nf4 = ["bitsandbytes>=0.46"]
# llama.cpp's converter imports sentencepiece before it falls back to the BPE vocabulary of Qwen.
gguf = ["sentencepiece>=0.2"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
dentabridge-core = { workspace = true }
