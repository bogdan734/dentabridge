[project]
name = "dentabridge-api"
version = "0.1.0"
description = "HTTP service for analyses, quotes, bookings and calls"
requires-python = ">=3.13"
dependencies = ["dentabridge-core", "dentabridge-pricing"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
dentabridge-core = { workspace = true }
dentabridge-pricing = { workspace = true }
