[alembic]
script_location = %(here)s/alembic
# sqlalchemy.url is set by whoever runs alembic (the CLI reads DENTABRIDGE_DB_URL)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
