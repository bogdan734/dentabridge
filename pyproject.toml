# Virtual root: no [project] table, so uv installs every member of packages/*.
# requires-python lives in each member; .python-version pins 3.13 for the workspace.
[tool.uv]
required-version = ">=0.11.19,<0.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "hypothesis>=6",
  "mypy>=2.4",
  "pytest>=9",
  "ruff>=0.17",
  "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src"]
# ruff 0.17 also formats Markdown; the gate covers Python only
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.mypy]
strict = true
files = ["packages/*/src", "packages/*/tests", "tests"]
# explicit bases let two packages each own tests/conftest.py without a "duplicate module" error
explicit_package_bases = true
mypy_path = [
  "packages/core/src",
  "packages/ml/src",
  "packages/api/src",
  "packages/pricing/src",
  "packages/voice/src",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
# importlib mode: packages may reuse test file names and conftest.py without collisions
addopts = "--strict-markers --import-mode=importlib"
markers = [
  "slow: long-running test, excluded from scripts/check",
  "gpu: needs a GPU, excluded from scripts/check",
  "network: needs network access, excluded from scripts/check",
]

# Heavy optional libraries are treated as untyped everywhere, so mypy gives the same answer on a
# machine that has the `train` extra and on CI that does not.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*", "transformers", "transformers.*", "peft", "peft.*", "accelerate", "accelerate.*", "mlx", "mlx.*", "mlx_vlm", "mlx_vlm.*"]
ignore_missing_imports = true
follow_imports = "skip"
