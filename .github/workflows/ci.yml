name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.19"
      # the light extras the voice package imports (whisper, soundfile, sacrebleu, the LiveKit SDK);
      # the gate then type-checks and tests them instead of skipping. torch (`train`) stays out.
      - run: uv sync --locked --all-packages --extra stt --extra harness --extra worker
      - run: scripts/check
